<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Archive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    h1 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; }
    .status { color: #94a3b8; font-size: 14px; }
    .msg-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-right: 4px solid #38bdf8; }
    .author { font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
    .content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    .time { font-size: 11px; color: #64748b; margin-top: 8px; }
    #loading { text-align: center; color: #a855f7; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>أرشيف رسائل الديسكورد</h1>
      <div id="stats" class="status">جاري تحميل الإحصائيات...</div>
    </header>

    <div id="loading">جاري جلب الرسائل...</div>
    <div id="messages-list"></div>
  </div>

  <script>
    async function loadData() {
      const statsEl = document.getElementById('stats');
      const listEl = document.getElementById('messages-list');
      const loadingEl = document.getElementById('loading');

      try {
        // جلب الإحصائيات
        const statsRes = await fetch('/api/stats');
        const stats = await statsRes.json();
        statsEl.innerHTML = `عدد الرسائل: <strong>${stats.totalMessages}</strong> | حالة البوت: <strong>${stats.status}</strong>`;

        // جلب الرسائل
        const msgRes = await fetch('/api/messages');
        const messages = await msgRes.json();

        loadingEl.style.display = 'none';

        if (!messages || messages.length === 0) {
          listEl.innerHTML = '<div style="text-align:center; color:#94a3b8;">لا توجد رسائل أرشفة حتى الآن.</div>';
          return;
        }

        listEl.innerHTML = messages.map(m => `
          <div class="msg-card">
            <div class="author">${m.author || 'مستخدم غير معروف'}</div>
            <div class="content">${m.content || '<i>(رسالة فارغة أو تحتوي على مرفقات فقط)</i>'}</div>
            <div class="time">${new Date(m.timestamp).toLocaleString('ar-EG')}</div>
          </div>
        `).join('');

      } catch (err) {
        loadingEl.style.color = '#ef4444';
        loadingEl.innerHTML = 'حدث خطأ أثناء تحميل البيانات: ' + err.message;
      }
    }

    loadData();
  </script>
</body>
</html>
